[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Require release tags to start with "v" (v0.1.0, not 0.1.0)
tag-namespace = "v"
# Never build or upload on pull requests; only a real tag push triggers this
pr-run-mode = "skip"
# Attest build provenance for every release artifact
github-attestations = true
# v-release.yml is hand-hardened (SHA pins, per-job permissions), so dist must not reject it as stale
allow-dirty = ["ci"]
