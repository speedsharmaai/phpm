name: landing

on:
  push:
    branches: [main]
    paths:
      - "site/landing/**"
      - "README.md"
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p site/sweep site/bench
          cp site/landing/index.html site/index.html
          # The landing page owns the Pages root; sweep.yml and bench-real.yml
          # own site/sweep/ and site/bench/ respectively. Each deploy replaces
          # the whole Pages artifact, so fetch the other two back from what is
          # currently live before uploading, the same way sweep.yml already
          # fetches /bench/* back rather than wiping it on its own deploys. A
          # path that is not live yet (first run, or Phase 05 still mid-debug
          # for /bench/) is simply skipped here, not poisoned into the
          # artifact — the dash-f flag makes curl fail, and -o only writes the
          # file on success.
          for f in index.html app.js results.json history.json badge.json; do
            curl -fsSL "https://${OWNER}.github.io/${REPO#*/}/sweep/$f" -o "site/sweep/$f" 2>/dev/null || rm -f "site/sweep/$f"
            curl -fsSL "https://${OWNER}.github.io/${REPO#*/}/bench/$f" -o "site/bench/$f" 2>/dev/null || rm -f "site/bench/$f"
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Shared with sweep.yml's and bench-real.yml's own deploy jobs: see
    # bench-real.yml's comment on why this has to be the same group.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
