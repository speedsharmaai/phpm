name: bench

on:
  workflow_dispatch:
    inputs:
      fixtures:
        description: Space-separated fixture names
        default: laravel-skeleton ytmate
        required: true

permissions: {}

jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FIXTURES: ${{ inputs.fixtures }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          tools: composer:2.10.3
          coverage: none
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: hyperfine@1.20.0
      - run: cargo build --release --locked -p phpm
      - name: Benchmark
        run: |
          export PHPM_BIN="$PWD/target/release/phpm"
          for f in $FIXTURES; do
            tools/bench/bench.sh "$f" composer phpm
          done | tee bench.log
      - name: Summary
        run: |
          {
            echo "## Composer vs phpm on $(uname -sr), $(df -T . | awk 'NR==2 {print $2}')"
            echo
            echo '| Fixture | Scenario | Composer | phpm | Speed-up |'
            echo '|---|---|---|---|---|'
            for f in $FIXTURES; do
              for s in cold warm noop; do
                c=$(jq '.results[0].mean' "target/bench/$f/composer-$s.json")
                p=$(jq '.results[0].mean' "target/bench/$f/phpm-$s.json")
                awk -v f="$f" -v s="$s" -v c="$c" -v p="$p" \
                  'BEGIN { printf "| %s | %s | %.3f s | %.4f s | %.1fx |\n", f, s, c, p, c / p }'
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-linux
          path: |
            bench.log
            target/bench/*/*.json
          retention-days: 90
