[files]
extend-exclude = ["fixtures/", "**/snapshots/", "*.snap", "Cargo.lock", "crates/*/tests/golden/", "crates/*/tests/data/", "crates/*/composer/*.php", "crates/*/vendor/*/*", "**/*.pen"]

[default.extend-words]
psr = "psr"
IST = "IST"
# \u{02ba}, a Unicode codepoint in a confusable-character table, not the word "by"/"be".
ba = "ba"
