[package]
name = "phpm-store"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Global store of extracted packages, dist downloads and linking into vendor/"
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls-no-provider"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { workspace = true }
sha1 = "0.11.0"
tokio = { version = "1.53.0", features = ["rt", "sync", "time"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
phpm-diffvendor = { path = "../phpm-diffvendor" }
tokio = { version = "1.53.0", features = ["io-util", "macros", "net", "rt-multi-thread"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[lints]
workspace = true
